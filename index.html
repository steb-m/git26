
<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Flexbox Template</title>
</head>

<body>

    <div class="page">

        <div class="header">

                <p>Header</p>
            </div>

        <div class="hero">

            </div>
        </div>
